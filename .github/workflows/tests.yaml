name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.14.0]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and run tests with Docker Compose
      run: |
        echo "pass" | docker login -u abc --password-stdin
        # docker compose up --build --abort-on-container-exit tests
        docker compose up --build --exit-code-from tests tests

    - name: Check test results
      run: |
        # Получаем exit code сервиса tests
        TESTS_EXIT_CODE=$(docker compose ps -q tests | xargs docker inspect -f '{{.State.ExitCode}}')
        if [ "$TESTS_EXIT_CODE" -ne 0 ]; then
          echo "Tests failed with exit code: $TESTS_EXIT_CODE"
          exit 1
        else
          echo "All tests passed!"
        fi
      
    - name: Stop containers
      run: docker compose down
    
